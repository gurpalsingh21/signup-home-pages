<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport"><meta content="web_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-secondary":"#ffffff","secondary-fixed":"#d8e2ff","surface-container-lowest":"#ffffff","on-secondary-fixed":"#001a42","on-error":"#ffffff","outline":"#737686","primary-container":"#2563eb","surface-container-low":"#f2f3ff","on-primary-fixed-variant":"#003ea8","on-primary-fixed":"#00174b","on-tertiary-fixed-variant":"#43474b","error":"#ba1a1a","on-surface":"#131b2e","on-tertiary":"#ffffff","secondary-fixed-dim":"#adc6ff","surface-container":"#eaedff","surface-variant":"#dae2fd","surface-bright":"#faf8ff","on-secondary-container":"#fefcff","tertiary":"#515659","outline-variant":"#c3c6d7","tertiary-container":"#696e71","on-surface-variant":"#434655","secondary-container":"#2170e4","surface":"#faf8ff","surface-container-highest":"#dae2fd","inverse-on-surface":"#eef0ff","on-background":"#131b2e","background":"#faf8ff","on-tertiary-container":"#edf1f5","tertiary-fixed-dim":"#c3c7cb","on-secondary-fixed-variant":"#004395","inverse-primary":"#b4c5ff","on-primary":"#ffffff","on-tertiary-fixed":"#171c1f","surface-dim":"#d2d9f4","surface-tint":"#0053db","inverse-surface":"#283044","surface-container-high":"#e2e7ff","primary":"#004ac6","primary-fixed-dim":"#b4c5ff","on-error-container":"#93000a","tertiary-fixed":"#dfe3e7","secondary":"#0058be","error-container":"#ffdad6","on-primary-container":"#eeefff","primary-fixed":"#dbe1ff"},borderRadius:{DEFAULT:"0.125rem",lg:"0.25rem",xl:"0.5rem",full:"0.75rem"},spacing:{"margin-mobile":"1rem",margin:"2rem","space-xl":"2rem",gutter:"1.5rem","gutter-mobile":"1rem","space-sm":"0.5rem","space-xs":"0.25rem","space-lg":"1.5rem","space-md":"1rem"},fontFamily:{caption:["Inter"],"display-hero-mobile":["Inter"],"display-hero":["Inter"],"label-md":["Inter"],"headline-lg":["Inter"],"body-lg":["Inter"],"headline-md":["Inter"],"body-md":["Inter"],"label-sm":["Inter"]},fontSize:{caption:["0.75rem",{lineHeight:"1rem",letterSpacing:"0em",fontWeight:"400"}],"display-hero-mobile":["1.75rem",{lineHeight:"2.25rem",letterSpacing:"-0.02em",fontWeight:"700"}],"display-hero":["2.25rem",{lineHeight:"2.75rem",letterSpacing:"-0.025em",fontWeight:"700"}],"label-md":["0.875rem",{lineHeight:"1.25rem",letterSpacing:"0em",fontWeight:"500"}],"headline-lg":["1.5rem",{lineHeight:"2rem",letterSpacing:"-0.02em",fontWeight:"600"}],"body-lg":["1rem",{lineHeight:"1.5rem",letterSpacing:"0em",fontWeight:"400"}],"headline-md":["1.25rem",{lineHeight:"1.75rem",letterSpacing:"-0.015em",fontWeight:"600"}],"body-md":["0.875rem",{lineHeight:"1.375rem",letterSpacing:"0em",fontWeight:"400"}],"label-sm":["0.75rem",{lineHeight:"1rem",letterSpacing:"0.01em",fontWeight:"500"}]}}}};</script></head><body class="min-h-screen bg-background font-body-md text-on-surface antialiased"><main class="min-h-screen w-full bg-background flex flex-col justify-center items-center px-margin-mobile md:px-margin"><div class="flex flex-col w-full items-center justify-center py-space-xl">
<!-- Viewport Context Indicator -->
<div class="mb-space-lg flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-surface-container text-on-surface-variant shadow-sm">
<span class="material-symbols-outlined text-[16px] text-primary">devices</span>
<span class="font-label-sm text-caption uppercase tracking-wider font-semibold">
      Breakpoint: sm (≥640px) • Max Width: 420px
    </span>
</div>
<!-- Simulated sm Viewport Canvas Wrapper -->
<div class="w-full max-w-[640px] px-gutter-mobile sm:px-0 flex flex-col items-center">
<!-- Focused Authentication Card -->
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-sm p-6 relative overflow-hidden transition-all duration-200">
<!-- Brand & Header -->
<div class="flex items-center gap-space-xs mb-space-md">
<div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">dataset</span>
</div>
<span class="font-label-md text-label-md font-bold text-on-surface tracking-tight">Nexus Studio</span>
</div>
<h1 class="font-headline-lg text-headline-lg font-bold text-on-surface mb-1">
        Create your account
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-6">
        It only takes a minute.
      </p>
<!-- Registration Form -->
<form class="space-y-4" id="signup-form" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="flex flex-col">
<label class="font-label-md text-body-md font-medium text-on-surface mb-1.5 text-left" for="fullname">
            Full name
          </label>
<div class="relative">
<input class="w-full min-h-[44px] bg-surface-container-lowest text-on-surface placeholder:text-outline rounded-lg px-3.5 font-body-md text-body-md shadow-sm outline-none transition-all duration-150 focus:bg-surface focus:shadow-md" id="fullname" name="fullname" placeholder="Jane Doe" required="" type="text">
</div>
</div>
<!-- Email Address -->
<div class="flex flex-col">
<label class="font-label-md text-body-md font-medium text-on-surface mb-1.5 text-left" for="email">
            Email address
          </label>
<div class="relative">
<input class="w-full min-h-[44px] bg-surface-container-lowest text-on-surface placeholder:text-outline rounded-lg px-3.5 font-body-md text-body-md shadow-sm outline-none transition-all duration-150 focus:bg-surface focus:shadow-md" id="email" name="email" placeholder="jane@example.com" required="" type="email">
</div>
</div>
<!-- Password -->
<div class="flex flex-col">
<label class="font-label-md text-body-md font-medium text-on-surface mb-1.5 text-left" for="password">
            Password
          </label>
<div class="relative">
<input class="w-full min-h-[44px] bg-surface-container-lowest text-on-surface placeholder:text-outline rounded-lg px-3.5 pr-11 font-body-md text-body-md shadow-sm outline-none transition-all duration-150 focus:bg-surface focus:shadow-md" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface focus:outline-none flex items-center justify-center p-1 rounded transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Updates Checkbox -->
<div class="pt-1">
<label class="flex items-center gap-2.5 cursor-pointer group select-none">
<input checked="" class="w-[18px] h-[18px] rounded cursor-pointer accent-primary transition-all duration-150" id="updates" name="updates" type="checkbox">
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">
              Send me occasional updates
            </span>
</label>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full min-h-[44px] h-11 bg-primary text-on-primary font-label-md text-body-md font-medium rounded-lg shadow-sm hover:shadow-md transition-all duration-150 flex items-center justify-center gap-2 active:scale-[0.99]" id="submit-btn" type="submit">
<span>Sign up</span>
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-0.5">arrow_forward</span>
</button>
</div>
</form>
<!-- Legal Footnote & Switch Link -->
<div class="mt-5 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
          Already have an account?
          <a class="text-primary font-label-md font-medium hover:underline focus:outline-none transition-colors ml-1" href="#login">
            Log in
          </a>
</p>
</div>
<!-- Trust Badges Bar -->
<div class="mt-6 pt-4 bg-surface-container-low rounded-lg p-3 flex items-center justify-between text-outline text-caption font-caption">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span>Bank-grade 256-bit encryption</span>
</div>
<div class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span>SSO Ready</span>
</div>
</div>
</div>
<!-- Responsive Dimensions Metadata -->
<div class="mt-4 flex items-center justify-center gap-space-sm text-outline font-caption text-caption">
<span>Screen Width: Simulated min 640px</span>
<span>•</span>
<span>Card: 420px max</span>
<span>•</span>
<span>Touch Target: 44px</span>
</div>
</div>
<script>
    (function () {
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      const icon = document.getElementById('pwd-icon');

      if (toggleBtn && passwordInput && icon) {
        toggleBtn.addEventListener('click', function () {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          icon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }

      const form = document.getElementById('signup-form');
      const submitBtn = document.getElementById('submit-btn');
      if (form && submitBtn) {
        form.addEventListener('submit', function () {
          const originalContent = submitBtn.innerHTML;
          submitBtn.innerHTML = `
            <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
            <span>Setting up...</span>
          `;
          submitBtn.disabled = true;
          setTimeout(() => {
            submitBtn.innerHTML = originalContent;
            submitBtn.disabled = false;
          }, 1200);
        });
      }
    })();
  </script>
</div></main></body></html>
